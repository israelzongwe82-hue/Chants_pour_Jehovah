name: Construire Chants pour Jehovah Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'manifest.json'
      - 'audio/**'
      - 'images/**'
      - 'package.json'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    name: Construire l'application Windows
    runs-on: windows-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier les fichiers nécessaires
        shell: pwsh
        run: |
          $required = @(
            "index.html",
            "style.css",
            "app.js",
            "manifest.json",
            "images/icon.png",
            "images/splash.png"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Fichier manquant : $file"
            }
          }

          if (!(Test-Path "audio")) {
            throw "Le dossier audio est introuvable."
          }

          Write-Host "Tous les fichiers nécessaires sont présents."

      - name: Préparer les fichiers Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-app | Out-Null

          Copy-Item index.html windows-app/
          Copy-Item style.css windows-app/
          Copy-Item app.js windows-app/
          Copy-Item manifest.json windows-app/
          Copy-Item audio windows-app/ -Recurse -Force
          Copy-Item images windows-app/ -Recurse -Force

      - name: Préparer les fichiers Electron
        shell: pwsh
        run: |
          @'
          {
            "name": "chants-pour-jehovah",
            "version": "1.0.0",
            "private": true,
            "description": "Chants pour Jéhovah - lecteur musical hors connexion",
            "main": "main.js",
            "author": "KIBWE ZONGWE Israël",
            "scripts": {
              "start": "electron .",
              "build:windows": "electron-builder --win nsis --x64 --publish never"
            },
            "devDependencies": {
              "electron": "^39.0.0",
              "electron-builder": "^26.0.0"
            },
            "build": {
              "appId": "com.israelzongwe.chantspourjehovah",
              "productName": "Chants pour Jéhovah",
              "directories": {
                "output": "dist"
              },
              "files": [
                "main.js",
                "index.html",
                "style.css",
                "app.js",
                "manifest.json",
                "audio/**/*",
                "images/**/*",
                "splash.html"
              ],
              "win": {
                "target": [
                  {
                    "target": "nsis",
                    "arch": ["x64"]
                  }
                ],
                "icon": "icon.ico",
                "artifactName": "Chants-pour-Jehovah-Setup-${version}.${ext}"
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true,
                "shortcutName": "Chants pour Jéhovah"
              }
            }
          }
          '@ | Set-Content -Encoding utf8 windows-app/package.json

          @'
          const { app, BrowserWindow } = require("electron");
          const path = require("path");

          let mainWindow;
          let splashWindow;

          function createSplash() {
            splashWindow = new BrowserWindow({
              width: 520,
              height: 420,
              frame: false,
              resizable: false,
              center: true,
              show: true,
              alwaysOnTop: true,
              autoHideMenuBar: true,
              backgroundColor: "#071426",
              icon: path.join(__dirname, "icon.ico")
            });

            splashWindow.loadFile("splash.html");
          }

          function createMainWindow() {
            mainWindow = new BrowserWindow({
              width: 1100,
              height: 760,
              minWidth: 320,
              minHeight: 560,
              show: false,
              autoHideMenuBar: true,
              backgroundColor: "#071426",
              icon: path.join(__dirname, "icon.ico"),
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            });

            mainWindow.loadFile("index.html");

            mainWindow.once("ready-to-show", () => {
              if (splashWindow && !splashWindow.isDestroyed()) {
                splashWindow.close();
              }

              mainWindow.show();
            });

            mainWindow.on("closed", () => {
              mainWindow = null;
            });
          }

          app.whenReady().then(() => {
            createSplash();
            createMainWindow();

            app.on("activate", () => {
              if (BrowserWindow.getAllWindows().length === 0) {
                createMainWindow();
              }
            });
          });

          app.on("window-all-closed", () => {
            if (process.platform !== "darwin") {
              app.quit();
            }
          });
          '@ | Set-Content -Encoding utf8 windows-app/main.js

          @'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Chants pour Jéhovah</title>
            <style>
              * { box-sizing: border-box; }
              html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #071426;
              }
              body {
                display: flex;
                align-items: center;
                justify-content: center;
              }
              img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
              }
            </style>
          </head>
          <body>
            <img src="images/splash.png" alt="Chants pour Jéhovah">
          </body>
          </html>
          '@ | Set-Content -Encoding utf8 windows-app/splash.html

      - name: Générer l'icône Windows
        shell: pwsh
        run: |
          python -m pip install Pillow

          @'
          from PIL import Image

          image = Image.open("windows-app/images/icon.png").convert("RGBA")
          image.save(
              "windows-app/icon.ico",
              format="ICO",
              sizes=[
                  (16, 16),
                  (24, 24),
                  (32, 32),
                  (48, 48),
                  (64, 64),
                  (128, 128),
                  (256, 256)
              ]
          )

          print("Icône Windows générée.")
          '@ | python -

      - name: Installer les dépendances Windows
        working-directory: windows-app
        run: npm install

      - name: Construire le programme Windows
        working-directory: windows-app
        run: npm run build:windows

      - name: Publier le programme Windows
        uses: actions/upload-artifact@v4
        with:
          name: Chants-pour-Jehovah-Windows
          path: windows-app/dist/*.exe
          if-no-files-found: error
          retention-days: 14
